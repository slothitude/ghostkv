[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ghostkv"
version = "0.2.0"
description = "Memory that haunts, not repeats — an agent CLI with compressed KV memory as persistent brain"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Aaron King" },
]
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "jinja2>=3.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
ghostkv = "ghostkv.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
